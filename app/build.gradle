plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'app.xvi.web'
    compileSdk 37
    defaultConfig {
        applicationId 'app.xvi.web'
        minSdk 26
        targetSdk 36
        versionName '0.3.3'
        // Derived from versionName (major * 10000 + minor * 100 + patch) so the two never drift apart.
        versionCode versionName.split('\\.').collect { it as int }.inject(0) { code, part -> code * 100 + part }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters.addAll((findProperty('webAbis') ?: 'arm64-v8a,x86_64').split(',')) }
    }
    androidResources { localeFilters += ['zh-rCN'] }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
    buildTypes {
        release {
            // Keep local release installs usable; replace with a production key for publishing.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}
dependencies {
    implementation project(':v2ray')
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.webkit
    implementation libs.lifecycle.runtime.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.okhttp
    implementation libs.jsoup
    implementation libs.zxing.core
    coreLibraryDesugaring libs.desugar.jdk.libs
    testImplementation libs.junit4
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.test.rules
}
