plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'app.xvi.web'
    compileSdk 37
    defaultConfig {
        applicationId 'app.xvi.web'
        minSdk 26
        targetSdk 36
        versionName '0.2.0'
        // Derived from versionName (major * 10000 + minor * 100 + patch) so the two never drift apart.
        versionCode versionName.split('\\.').collect { it as int }.inject(0) { code, part -> code * 100 + part }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters.addAll((findProperty('webAbis') ?: 'arm64-v8a,x86_64').split(',')) }
    }
    androidResources { localeFilters += ['zh-rCN'] }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
    buildTypes {
        release {
            // Keep local release installs usable; replace with a production key for publishing.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true }
}
dependencies {
    implementation project(':v2ray')
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation libs.okhttp
    implementation 'org.jsoup:jsoup:1.21.2'
    coreLibraryDesugaring libs.desugar.jdk.libs
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
