<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://appassets.androidplatform.net; style-src https://appassets.androidplatform.net 'unsafe-inline'; font-src https://appassets.androidplatform.net">
<link rel="stylesheet" href="katex.min.css">
<style>
:root { --ink: #222; --muted: #777; --accent: #2f7a6b; --base: #f1eee9; --selected: #e4efe9; --danger: #b3261e; --surface: #fff; }
html, body { margin: 0; padding: 0; background: var(--surface); color: var(--ink); }
body { font: 15px/1.65 sans-serif; word-wrap: break-word; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; }
#log { padding: 2px 2px 14px; }
.message { margin-top: 10px; }
.message.user { display: flex; justify-content: flex-end; padding-left: 48px; }
.message.user .body { background: var(--selected); border-radius: 16px; padding: 8px 14px; white-space: pre-wrap; }
.message.user .actions { display: none; }
.message.waiting .body { color: var(--muted); }
.message.error .body { color: var(--danger); }
.body > :first-child { margin-top: 0; }
.body > :last-child { margin-bottom: 0; }
p, ul, ol, blockquote, table, .code, .math { margin: 0 0 .7em; }
h1, h2, h3, h4, h5, h6 { font-size: 1.05em; line-height: 1.4; margin: 1em 0 .4em; }
h1 { font-size: 1.2em; } h2 { font-size: 1.12em; }
ul, ol { padding-left: 1.4em; }
li > p { margin: 0; }
li.task-item { list-style: none; margin-left: -1.2em; }
.task { color: var(--muted); } .task.done { color: var(--accent); }
a { color: var(--accent); text-decoration: none; }
a.image::before { content: "🖼 "; }
blockquote { border-left: 3px solid var(--muted); color: var(--muted); padding-left: .8em; margin-left: 0; }
hr { border: 0; border-top: 1px solid var(--base); margin: 1em 0; }
code { font: .88em/1.5 monospace; background: var(--base); border-radius: 4px; padding: .1em .3em; }
.code { position: relative; }
pre { background: var(--base); border-radius: 10px; padding: 10px 12px; margin: 0; overflow-x: auto; }
pre code { background: none; padding: 0; white-space: pre; }
.code-copy { position: absolute; right: 8px; top: 6px; font-size: 12px; color: var(--muted); }
table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
th, td { border: 1px solid var(--base); padding: 4px 8px; text-align: left; }
th { background: var(--base); }
.math { overflow-x: auto; overflow-y: hidden; }
.katex { font-size: 1.1em; }
.actions { display: flex; align-items: center; gap: 16px; min-height: 0; font-size: 13px; }
.actions:not(:empty) { margin-top: 6px; min-height: 32px; }
.actions .note { flex: 1; color: var(--muted); font-size: 12px; }
.actions a { color: var(--muted); padding: 6px 0; }
</style>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<script src="ai-render.js"></script>
</head>
<body><div id="log"></div></body>
</html>
